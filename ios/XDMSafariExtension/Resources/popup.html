<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XDM Interceptor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="panel">
    <div class="header">
      <div class="logo">XDM</div>
      <div class="title">Safari Redirect</div>
    </div>
    <hr class="divider">
    <div class="row">
      <span>Intercept downloads</span>
      <label class="switch">
        <input type="checkbox" id="toggleEnabled" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="status" id="statusText">XDM: active</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
