name: DMX CI Production Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-format:
    name: 🔍 Static Analysis & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run analyzer
        run: flutter analyze --fatal-infos --fatal-warnings

  test-coverage:
    name: 🧪 Unit & Regression Tests (Coverage Gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify test manifest integrity
        run: |
          find test -name "*_test.dart" | sort > current_tests.txt
          cat test/TEST_MANIFEST.txt | tr -d '\r' | sort > expected_tests.txt
          diff -u expected_tests.txt current_tests.txt || (echo "Test manifest mismatch!" && exit 1)

      - name: Run unit & regression test suite
        run: flutter test --coverage

      - name: Verify coverage threshold
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "Coverage file generated successfully."
          fi

  android-build:
    name: 🤖 Android Compilation & JVM Tests Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Gradle testDebugUnitTest
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --continue || true
