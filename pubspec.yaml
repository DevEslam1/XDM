name: dmx
description: "A Extreme Download Manger Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 3.0.0+1

environment:
  sdk: ^3.12.0


dependencies:
  flutter:
    sdk: flutter

  # Use with the CupertinoIcons class for iOS style icons.
  provider: ^6.1.5+1
  dio: ^5.9.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  path: ^1.9.1
  flutter_local_notifications: ^22.0.1
  flutter_background_service: ^5.0.0
  connectivity_plus: ^7.1.1
  open_filex: ^4.5.0
  receive_sharing_intent: ^1.8.0
  fl_chart: ^1.2.0
  webview_flutter: ^4.10.0

  share_plus: ^12.0.2
  file_picker: ^11.0.2
  crypto: ^3.0.7
  libtorrent_flutter: ^1.8.5
  logging: ^1.3.0
  url_launcher: ^6.3.0
  font_awesome_flutter: ^11.0.0
  flutter_secure_storage: ^10.3.1
  encrypt: ^5.0.3
  ffmpeg_kit_flutter_new_min: ^3.4.2
  package_info_plus: ^9.0.1
  drift: ^2.34.2
  sqlite3: ^3.0.0
  webview_cookie_manager: ^2.0.6
  synchronized: ^3.4.1
  device_info_plus: ^12.4.0

  uuid: ^4.6.0
  cached_network_image: ^3.4.1


dependency_overrides:
  webview_cookie_manager:
    path: packages/webview_cookie_manager
  open_filex:
    path: packages/open_filex


dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  connectivity_plus_platform_interface: ^2.1.0
  drift_dev: ^2.34.4
  build_runner: ^2.15.1


flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#13141F"
  adaptive_icon_foreground: "assets/app_icon/icon.png"
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/app_icon/icon.png
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
