name: dmx
description: "A Extreme Download Manger Flutter project."
publish_to: "none"
version: 3.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State
  provider: ^6.1.5+1
  get_it: ^8.0.3

  # Networking
  dio: ^5.11.0
  connectivity_plus: ^7.3.1
  cronet_http: ^1.4.0
  cupertino_http: ^2.2.0

  # Storage / DB
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  path: ^1.9.1
  drift: ^2.34.3
  # sqlite3: removed — transitive dep of drift, do not pin separately

  # Permissions / platform
  permission_handler: ^12.0.3
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  flutter_secure_storage: ^10.3.1
  battery_plus: ^6.2.1
  wakelock_plus: ^1.3.3

  # Notifications / background
  flutter_local_notifications: ^22.2.0
  flutter_background_service: ^5.0.0

  # WebView
  webview_flutter: ^4.14.1
  webview_flutter_platform_interface: ^2.10.0
  webview_cookie_manager:
    path: packages/webview_cookie_manager

  # Media / torrent
  libtorrent_flutter: 1.9.2 # exact pin: no saveResumeData API in this version
  ffmpeg_kit_flutter_new_min: ^3.5.5

  # UI / utils
  open_filex: ^4.5.0
  fl_chart: ^1.2.0
  share_plus: ^13.3.0
  file_picker: 12.0.0-beta.7
  url_launcher: ^6.3.0
  font_awesome_flutter: ^11.0.0
  cached_network_image: ^3.4.1
  uuid: ^4.6.0
  crypto: ^3.0.7
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  logging: ^1.3.0
  synchronized: ^3.4.1
  receive_sharing_intent: ^1.9.0

  # Crash reporting
  sentry_flutter: ^9.0.0
  fake_async: ^1.3.3

dependency_overrides:
  # webview_cookie_manager 2.0.6 on pub.dev still uses the removed v1
  # embedding API (PluginRegistry.Registrar) and fails to compile on
  # current Flutter. Use the local patched copy (v2 FlutterPlugin embedding).
  webview_cookie_manager:
    path: packages/webview_cookie_manager

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.4
  connectivity_plus_platform_interface: ^2.0.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#13141F"
  adaptive_icon_foreground: "assets/app_icon/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon/icon.png
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
